<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Shared rooms: two people, one live board">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8aa2b8"/>
    </marker>
  </defs>
  <rect width="1200" height="380" rx="16" fill="#f4f7fa"/>
  <rect width="1200" height="380" rx="16" fill="none" stroke="#dde6ee"/>

  <!-- You -->
  <g transform="translate(90,70)">
    <text x="90" y="0" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#1e2a38">You — Place A</text>
    <!-- laptop -->
    <rect x="30" y="20" width="120" height="80" rx="8" fill="#1d3557"/>
    <rect x="38" y="28" width="104" height="64" rx="4" fill="#ffffff"/>
    <rect x="46" y="38" width="60" height="26" rx="4" fill="#fff8e6" stroke="#f0a202"/>
    <text x="52" y="55" font-family="Segoe UI, sans-serif" font-size="9" fill="#8a8878">09:14</text>
    <rect x="46" y="72" width="50" height="14" rx="4" fill="#e9f4ff" stroke="#3fa9f5"/>
    <rect x="10" y="104" width="160" height="8" rx="4" fill="#33507a"/>
    <text x="90" y="140" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#5c6f82">presses Ctrl+Alt+C</text>
  </g>

  <!-- Friend -->
  <g transform="translate(90,225)">
    <text x="90" y="0" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#1e2a38">Friend — Place B</text>
    <rect x="30" y="20" width="120" height="80" rx="8" fill="#1d3557"/>
    <rect x="38" y="28" width="104" height="64" rx="4" fill="#ffffff"/>
    <rect x="46" y="38" width="60" height="26" rx="4" fill="#fff8e6" stroke="#f0a202"/>
    <text x="52" y="55" font-family="Segoe UI, sans-serif" font-size="9" fill="#8a8878">09:14</text>
    <rect x="46" y="72" width="50" height="14" rx="4" fill="#e9f4ff" stroke="#3fa9f5"/>
    <rect x="10" y="104" width="160" height="8" rx="4" fill="#33507a"/>
    <text x="90" y="140" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#5c6f82">just a browser</text>
  </g>

  <!-- arrows to cloud -->
  <line x1="330" y1="185" x2="440" y2="170" stroke="#8aa2b8" stroke-width="3" marker-end="url(#arr2)"/>
  <line x1="330" y1="300" x2="440" y2="235" stroke="#8aa2b8" stroke-width="3" marker-end="url(#arr2)"/>

  <!-- cloud room -->
  <g transform="translate(450,120)">
    <path d="M60 90 a34 34 0 0 1 6 -67 a44 44 0 0 1 84 -6 a30 30 0 0 1 26 53 z" fill="#ffffff" stroke="#3fa9f5" stroke-width="3"/>
    <text x="125" y="130" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" font-weight="bold" fill="#1e2a38">The room link</text>
    <text x="125" y="152" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#5c6f82">everyone with the link</text>
    <text x="125" y="170" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#5c6f82">sees the same board, live</text>
  </g>

  <!-- arrows to shared board -->
  <line x1="740" y1="170" x2="860" y2="195" stroke="#8aa2b8" stroke-width="3" marker-end="url(#arr2)"/>

  <!-- shared board -->
  <g transform="translate(870,80)">
    <text x="150" y="0" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#1e2a38">One shared board</text>
    <rect x="0" y="20" width="300" height="230" rx="12" fill="#ffffff" stroke="#c9d6e4"/>
    <rect x="20" y="40" width="120" height="52" rx="8" fill="#fff8e6" stroke="#f0a202"/>
    <text x="30" y="66" font-family="Segoe UI, sans-serif" font-size="11" fill="#1e1e1e">hotel link</text>
    <text x="30" y="84" font-family="Segoe UI, sans-serif" font-size="8" fill="#8a8878">2026-11-10 09:14</text>
    <rect x="20" y="110" width="120" height="70" rx="8" fill="#e9f4ff" stroke="#3fa9f5"/>
    <path d="M34 160 l22 -20 l16 10 l26 -24 l24 18" stroke="#3fa9f5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="160" y="40" width="120" height="46" rx="8" fill="#f1f8eb" stroke="#4cc38a"/>
    <text x="170" y="64" font-family="Segoe UI, sans-serif" font-size="11" fill="#1e1e1e">friend's note</text>
    <text x="170" y="80" font-family="Segoe UI, sans-serif" font-size="8" fill="#8aa2b8">edits live in ~1 s</text>
    <path d="M180 190 q30 -40 60 -10 q30 30 60 -20" stroke="#e5534b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="150" y="240" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#5c6f82">your captures + their edits, merged safely</text>
  </g>

  <text x="600" y="366" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#8aa2b8">Same room link = same board. Nobody overwrites anybody — changes merge by item.</text>
</svg>
