<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="G WhiteBoard banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1a2b"/>
      <stop offset="1" stop-color="#16324f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4cc38a"/>
      <stop offset="1" stop-color="#3fa9f5"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#2a4a6e"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>

  <!-- clipboard -->
  <g transform="translate(120,88)">
    <rect x="0" y="0" width="120" height="150" rx="12" fill="#ffffff" opacity="0.96"/>
    <rect x="38" y="-12" width="44" height="22" rx="8" fill="#0e1a2b" stroke="#ffffff" stroke-width="0"/>
    <rect x="16" y="30" width="88" height="8" rx="4" fill="#c9d6e4"/>
    <rect x="16" y="50" width="88" height="8" rx="4" fill="#c9d6e4"/>
    <rect x="16" y="70" width="60" height="8" rx="4" fill="#c9d6e4"/>
    <rect x="16" y="96" width="88" height="40" rx="6" fill="#e8f0f9"/>
    <path d="M24 128 l14 -14 l10 8 l18 -18 l14 12" stroke="#4cc38a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- arrow from clipboard to board -->
  <g stroke="#3fa9f5" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M280 165 H380"/>
  </g>
  <path d="M380 152 l22 13 l-22 13 z" fill="#3fa9f5"/>

  <!-- board card -->
  <g transform="translate(430,70)">
    <rect x="0" y="0" width="230" height="120" rx="10" fill="#fff8e6" stroke="#f0a202" stroke-width="2"/>
    <text x="18" y="52" font-family="Segoe UI, sans-serif" font-size="17" fill="#1e1e1e">https://nice-link.com</text>
    <text x="18" y="98" font-family="Segoe UI, sans-serif" font-size="12" fill="#8a8878">2026-11-10  09:14</text>
  </g>
  <g transform="translate(500,205)">
    <rect x="0" y="0" width="150" height="72" rx="10" fill="#e9f4ff" stroke="#3fa9f5" stroke-width="2"/>
    <path d="M14 54 l26 -26 l20 16 l30 -30 l28 22" stroke="#3fa9f5" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- keyboard key -->
  <g transform="translate(790,120)">
    <rect x="0" y="0" width="290" height="86" rx="14" fill="#1d3557"/>
    <text x="24" y="55" font-family="Consolas, monospace" font-size="28" font-weight="bold" fill="#ffffff">Ctrl + Shift + C</text>
  </g>

  <!-- title -->
  <text x="430" y="46" font-family="Segoe UI, sans-serif" font-size="42" font-weight="bold" fill="#ffffff">G WhiteBoard</text>
  <text x="790" y="46" font-family="Segoe UI, sans-serif" font-size="17" fill="#9fb8d0">copy → shortcut → on your board, saved forever</text>

  <text x="120" y="292" font-family="Segoe UI, sans-serif" font-size="15" fill="#7f9cb8">Your clipboard, turned into a scrapbook that never forgets. Light as a feather — no Electron, ~20 MB.</text>
</svg>
