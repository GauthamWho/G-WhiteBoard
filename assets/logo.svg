<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="G WhiteBoard logo">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16324f"/>
      <stop offset="1" stop-color="#0e1a2b"/>
    </linearGradient>
  </defs>

  <!-- app tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#3fa9f5" stroke-opacity="0.35" stroke-width="8"/>

  <!-- the whiteboard -->
  <rect x="96" y="112" width="320" height="240" rx="28" fill="#ffffff"/>
  <rect x="216" y="96" width="80" height="34" rx="12" fill="#0e1a2b"/>

  <!-- a capture card on the board (orange = capture accent) -->
  <rect x="132" y="164" width="132" height="86" rx="14" fill="#fff8e6" stroke="#f0a202" stroke-width="6"/>
  <rect x="148" y="182" width="72" height="9" rx="4.5" fill="#c9b98a"/>
  <rect x="148" y="200" width="100" height="9" rx="4.5" fill="#e2d4a8"/>

  <!-- the pen mark (green chalk stroke) -->
  <path d="M286 250 q34 -52 62 -8 q22 34 58 -18" fill="none" stroke="#4cc38a" stroke-width="16" stroke-linecap="round"/>

  <!-- timestamp dashes (small, gray) -->
  <rect x="132" y="278" width="64" height="10" rx="5" fill="#b7c4d2"/>
  <rect x="206" y="278" width="44" height="10" rx="5" fill="#d3dce5"/>

  <!-- the "capture just arrived" dot -->
  <circle cx="424" cy="120" r="30" fill="#3fb950"/>
  <circle cx="424" cy="120" r="30" fill="none" stroke="#0e1a2b" stroke-width="10" stroke-opacity="0.55"/>
</svg>
