<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="How G WhiteBoard works in four steps">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8aa2b8"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="16" fill="#f4f7fa"/>
  <rect width="1200" height="420" rx="16" fill="none" stroke="#dde6ee"/>

  <!-- Step 1: copy -->
  <g transform="translate(50,60)">
    <circle cx="26" cy="-14" r="15" fill="#3fa9f5"/>
    <text x="26" y="-8" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#fff">1</text>
    <text x="0" y="34" font-family="Segoe UI, sans-serif" font-size="20" font-weight="bold" fill="#1e2a38">Copy anything</text>
    <text x="0" y="58" font-family="Segoe UI, sans-serif" font-size="14" fill="#5c6f82">text, a link, an image,</text>
    <text x="0" y="77" font-family="Segoe UI, sans-serif" font-size="14" fill="#5c6f82">or a screenshot —</text>
    <text x="0" y="96" font-family="Segoe UI, sans-serif" font-size="14" fill="#5c6f82">the way you always do</text>
    <g transform="translate(10,120)">
      <rect x="0" y="0" width="120" height="120" rx="10" fill="#ffffff" stroke="#c9d6e4"/>
      <rect x="42" y="-10" width="36" height="18" rx="7" fill="#3fa9f5"/>
      <rect x="16" y="26" width="88" height="8" rx="4" fill="#dbe6f0"/>
      <rect x="16" y="44" width="88" height="8" rx="4" fill="#dbe6f0"/>
      <rect x="16" y="62" width="56" height="8" rx="4" fill="#dbe6f0"/>
      <rect x="16" y="84" width="88" height="24" rx="6" fill="#eef4fa"/>
    </g>
  </g>

  <line x1="255" y1="200" x2="320" y2="200" stroke="#8aa2b8" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Step 2: hotkey -->
  <g transform="translate(345,60)">
    <circle cx="26" cy="-14" r="15" fill="#3fa9f5"/>
    <text x="26" y="-8" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#fff">2</text>
    <text x="0" y="34" font-family="Segoe UI, sans-serif" font-size="20" font-weight="bold" fill="#1e2a38">Press one shortcut</text>
    <text x="0" y="58" font-family="Segoe UI, sans-serif" font-size="14" fill="#5c6f82">works in any app,</text>
    <text x="0" y="77" font-family="Segoe UI, sans-serif" font-size="14" fill="#5c6f82">any time. Change it</text>
    <text x="0" y="96" font-family="Segoe UI, sans-serif" font-size="14" fill="#5c6f82">in config.json</text>
    <g transform="translate(10,132)">
      <rect x="0" y="0" width="120" height="40" rx="8" fill="#1d3557"/>
      <text x="60" y="26" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#ffffff">Ctrl+Shift+C</text>
      <rect x="0" y="50" width="120" height="40" rx="8" fill="#eef3f8" stroke="#c9d6e4"/>
      <text x="60" y="76" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#5c6f82">Mac: Fn+Cmd+C</text>
    </g>
  </g>

  <line x1="550" y1="200" x2="615" y2="200" stroke="#8aa2b8" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Step 3: watcher reads -->
  <g transform="translate(640,60)">
    <circle cx="26" cy="-14" r="15" fill="#3fa9f5"/>
    <text x="26" y="-8" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#fff">3</text>
    <text x="0" y="34" font-family="Segoe UI, sans-serif" font-size="20" font-weight="bold" fill="#1e2a38">The watcher reads it</text>
    <text x="0" y="58" font-family="Segoe UI, sans-serif" font-size="14" fill="#5c6f82">a tiny helper (~20 MB).</text>
    <text x="0" y="77" font-family="Segoe UI, sans-serif" font-size="14" fill="#5c6f82">Read-only: your</text>
    <text x="0" y="96" font-family="Segoe UI, sans-serif" font-size="14" fill="#5c6f82">clipboard stays intact</text>
    <g transform="translate(10,120)">
      <rect x="0" y="0" width="120" height="120" rx="10" fill="#ffffff" stroke="#c9d6e4"/>
      <path d="M24 62 q26 -26 52 0 q-26 26 -52 0 z" fill="none" stroke="#4cc38a" stroke-width="4"/>
      <circle cx="50" cy="62" r="10" fill="#4cc38a"/>
      <text x="60" y="106" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#8aa2b8">never modifies</text>
    </g>
  </g>

  <line x1="845" y1="200" x2="910" y2="200" stroke="#8aa2b8" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Step 4: board -->
  <g transform="translate(935,60)">
    <circle cx="26" cy="-14" r="15" fill="#4cc38a"/>
    <text x="26" y="-8" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#fff">4</text>
    <text x="0" y="34" font-family="Segoe UI, sans-serif" font-size="20" font-weight="bold" fill="#1e2a38">It's on your board</text>
    <text x="0" y="58" font-family="Segoe UI, sans-serif" font-size="14" fill="#5c6f82">a card with a tiny</text>
    <text x="0" y="77" font-family="Segoe UI, sans-serif" font-size="14" fill="#5c6f82">timestamp. Auto-saved</text>
    <text x="0" y="96" font-family="Segoe UI, sans-serif" font-size="14" fill="#5c6f82">forever, on your disk</text>
    <g transform="translate(10,120)">
      <rect x="0" y="0" width="160" height="74" rx="10" fill="#fff8e6" stroke="#f0a202" stroke-width="2"/>
      <text x="14" y="32" font-family="Segoe UI, sans-serif" font-size="13" fill="#1e1e1e">my copied text</text>
      <text x="14" y="58" font-family="Segoe UI, sans-serif" font-size="10" fill="#8a8878">2026-11-10  09:14</text>
      <rect x="0" y="86" width="160" height="52" rx="10" fill="#e9f4ff" stroke="#3fa9f5" stroke-width="2"/>
      <path d="M12 122 l24 -22 l18 12 l28 -26 l26 20" stroke="#3fa9f5" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <text x="600" y="398" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#8aa2b8">No save button. No settings. Just copy, press, done.</text>
</svg>
